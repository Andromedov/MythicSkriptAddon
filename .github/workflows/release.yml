name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    if: "contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[pre-release]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      do_release: ${{ steps.parse.outputs.do_release }}
      version_tag: ${{ steps.parse.outputs.version_tag }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      changelog: ${{ steps.get_release_notes.outputs.changelog }}
      release_name: ${{ steps.get_release_notes.outputs.release_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Commit Message
        id: parse
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Latest commit: $COMMIT_MSG"
          
          DO_RELEASE="false"
          IS_PRERELEASE="false"
          VERSION=""

          if [[ $COMMIT_MSG == *"[release]"* ]]; then
            DO_RELEASE="true"
            VERSION=$(echo "$COMMIT_MSG" | sed -nE 's/.*\[release\][[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]].*)?$/\1/p')
          elif [[ $COMMIT_MSG == *"[pre-release]"* ]]; then
            DO_RELEASE="true"
            IS_PRERELEASE="true"
            VERSION=$(echo "$COMMIT_MSG" | sed -nE 's/.*\[pre-release\][[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)([[:space:]].*)?$/\1/p')
          fi

          if [[ "$DO_RELEASE" == "true" && -z "$VERSION" ]]; then
            echo "::error::Release commit message contains an invalid or missing semantic version."
            exit 1
          fi

          echo "do_release=$DO_RELEASE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Get release notes from merged PR
        id: get_release_notes
        if: steps.parse.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | first | .number // empty')
          
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No merged PR is associated with commit ${GITHUB_SHA}."
            exit 1
          fi

          echo "Found merged PR #$PR_NUMBER"
          CHANGELOG=$(gh pr view "$PR_NUMBER" --json body --jq '.body')

          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            echo "::error::PR #$PR_NUMBER has no release notes in its description."
            exit 1
          fi

          RELEASE_NAME=$(printf '%s\n' "$CHANGELOG" | sed -n 's/^##[[:space:]]*//p' | head -n 1)
          VERSION_NUMBER="${{ steps.parse.outputs.version_tag }}"
          VERSION_NUMBER="${VERSION_NUMBER#v}"
          VERSION_PATTERN=$(printf '%s' "$VERSION_NUMBER" | sed 's/\./\\./g')

          if [[ ! "$RELEASE_NAME" =~ ^\[?v?${VERSION_PATTERN}\]?[[:space:]]+[-–—][[:space:]]+.+$ ]]; then
            echo "::error::The first PR heading must use '## [${VERSION_NUMBER}] – Release Name'."
            exit 1
          fi
          
          DELIMITER="release-notes-$(date +%s)-$RANDOM"
          {
            echo "changelog<<$DELIMITER"
            echo "$CHANGELOG"
            echo "$DELIMITER"
            echo "release_name=$RELEASE_NAME"
          } >> $GITHUB_OUTPUT

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build --no-daemon

      - name: Filter main artifact
        id: filter
        run: |
          mkdir -p release-artifact
          cd build/libs
          for file in *.jar; do
            if [[ "$file" != *"-plain.jar"* && "$file" != *"-sources.jar"* && "$file" != *"-javadoc.jar"* ]]; then
              FINAL_NAME="$file"

              if [[ "${{ steps.parse.outputs.is_prerelease }}" == "true" ]]; then
                BASENAME="${file%.jar}"
                BASENAME="${BASENAME%-SNAPSHOT}"
                FINAL_NAME="${BASENAME}-SNAPSHOT.jar"
              fi

              cp "$file" "../../release-artifact/$FINAL_NAME"
              echo "Prepared artifact: $FINAL_NAME"
            fi
          done

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: release-artifact/*.jar
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-artifact
          path: release-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version_tag }}
          name: ${{ needs.build.outputs.release_name }}
          body: ${{ needs.build.outputs.changelog }}
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          files: release-artifact/*.jar

      - name: Publish to Modrinth
        if: needs.build.outputs.is_prerelease == 'false'
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          modrinth-id: "62Xr9WQ6"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: ${{ needs.build.outputs.release_name }}
          version: ${{ needs.build.outputs.version_tag }}
          version-type: ${{ needs.build.outputs.is_prerelease == 'true' && 'beta' || 'release' }}
          changelog: ${{ needs.build.outputs.changelog }}
          files: release-artifact/*.jar
          loaders: |
            paper
            purpur
          game-versions: |
            >=1.21.4 <=26.2
          dependencies: |
            mythicmobs(required){modrinth:NLuc7Jjh}
            skript(required){modrinth:xFNYAvMk}
